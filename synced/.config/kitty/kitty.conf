# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# machine dependent configuration
include private.conf

background_opacity 0.8

# The quick brown fox jumps over the lazy dog
#
# abcdefghijklmnopqrstuvwxyz
# 0123456789-_=+
#
# ~!@#$%^&* {} [] () I1l O0o
#
# !== \\ <= #{ -> ~@ |> 0x12
#
# |=>==<==>=|======|===|===>
#
# <---|--|--------|-<->--<-|
#
# != ~= =~ |> >>= >>> |=
#
# [INFO] todo)) fixme))

font_size 12
disable_ligatures always
# BEGIN_KITTY_FONTS
font_family      family='JetBrains Mono' style=Regular           features='-calt +zero'
bold_font        family='JetBrains Mono' style=SemiBold          features='-calt +zero'
italic_font      family='JetBrains Mono' style=Italic            features='-calt +zero'
bold_italic_font family='JetBrains Mono' style='SemiBold Italic' features='-calt +zero'
# END_KITTY_FONTS

modify_font underline_thickness 75%

remember_window_size  yes
initial_window_width  1000
initial_window_height 600

# tmux specifics
# also, this disables reading the clipboard with osc52 iirc
# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.clipboard_control
clipboard_control write-primary write-clipboard no-append

# mac specifics
map alt+w no_op
map cmd+w no_op

# performance
repaint_delay 3
sync_to_monitor yes
wayland_enable_ime no

enable_audio_bell no

tab_bar_style hidden

# fix mouse flickering
mouse_hide_wait 3.0 0.1 10 yes
